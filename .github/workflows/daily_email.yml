name: Daily Job Email Bot

on:
  schedule:
    # Runs at 3:30 AM UTC = 9:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch:  # lets you also trigger it manually from GitHub

jobs:
  send-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install secure-smtplib

      - name: Run email bot
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python job_bot_real_hrlist.py

      - name: Save database back to repo (so no one gets emailed twice)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add aftab_contacted.db || true
          git diff --staged --quiet || git commit -m "Update contacted DB - $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
